name: Build DMG

# Builds GlassyBattery.app, packages it as a drag-to-Applications DMG and, on every merge to main,
# publishes it as a GitHub release that Sparkle offers to installed copies.
#
#   pull_request → main   check the PR bumped the version, then build and verify (no release)
#   push → main           build, verify, sign the update, release v<version> with the DMG and
#                         its appcast.xml
#   workflow_dispatch     build and verify any branch; the DMG is kept as a workflow artifact
#
# VERSIONS. Each PR sets the app's semantic version with scripts/set-version.sh (the build number
# follows from it). The version job fails a PR whose version isn't above the newest release, so
# every merge releases something new; the release job fails if v<version> already exists.
#
# SPARKLE. The app reads its updates from the newest release's appcast.xml
# (SUFeedURL in GlassyBattery/Info.plist). Each DMG is signed with the EdDSA key whose public
# half is SUPublicEDKey there. The private key lives in the maintainer's login keychain
# (generate_keys --account glassybattery) and in the SPARKLE_PRIVATE_KEY repository secret; the
# release job stops if that secret is missing rather than publish an update nobody can install.
#
# SIGNING. The DMG is AD-HOC SIGNED, not signed with a Developer ID and not notarized, because CI
# has no access to a signing certificate. Gatekeeper refuses a downloaded copy until the
# quarantine flag is cleared (the release notes say how):
#
#     xattr -dr com.apple.quarantine /Applications/GlassyBattery.app
#
# Updates installed by Sparkle don't need that: Sparkle clears the flag itself. Shipping a DMG
# the public can open normally needs a Developer ID certificate and notarization — see
# "SHIPPING A SIGNED, NOTARIZED DMG" at the bottom of this file.
#
# Ad-hoc builds here also pass ENABLE_HARDENED_RUNTIME=NO. That is a TEMPORARY workaround, not a
# preference; it is undone by the Developer ID path below. See the comment on the build step.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write # creating the release and its tag

concurrency:
  group: build-dmg-${{ github.ref }}
  # A newer push to a PR replaces the build in progress; merges to main queue, since each one
  # releases.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version is bumped
        run: |
          set -euo pipefail
          # set-version.sh edits with BSD sed; --check only reads, which GNU sed does the same way.
          read -r VERSION BUILD < <(bash scripts/set-version.sh --print)
          LATEST=$(git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "This PR: $VERSION (build $BUILD). Newest release: ${LATEST:-none}."
          if [[ -n "$LATEST" ]]; then
            if [[ "$VERSION" == "$LATEST" || "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]]; then
              echo "::error file=GlassyBattery.xcodeproj/project.pbxproj::Version $VERSION isn't above the newest release, $LATEST. Merging releases a new version: run scripts/set-version.sh with a MAJOR, MINOR or PATCH bump of $LATEST that fits this change."
              exit 1
            fi
          fi

  dmg:
    # GlassyBattery calls SwiftUI's glassEffect(), which only exists in the macOS 26 SDK, so this
    # needs an image carrying Xcode 26. macos-latest tracks GitHub's newest stable image, which
    # gets there on its own as the label advances; the SDK check below is what turns a too-old
    # image into a clear failure instead of a confusing compile error.
    runs-on: macos-latest
    env:
      RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Before the build, so a merge that forgot to bump the version fails in seconds.
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          read -r VERSION BUILD < <(scripts/set-version.sh --print)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, build $BUILD"
          if [[ "$RELEASE" == "true" ]]; then
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null || gh release view "v$VERSION" >/dev/null 2>&1; then
              echo "::error::v$VERSION is already released. Bump the version with scripts/set-version.sh in a PR."
              exit 1
            fi
            if [[ "$HAS_KEY" != "true" ]]; then
              echo "::error::The SPARKLE_PRIVATE_KEY secret is missing, so the update can't be signed. See the SPARKLE note at the top of this workflow."
              exit 1
            fi
          fi

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          if ! xcodebuild -showsdks | grep -q "macosx26"; then
            echo "::error::No macOS 26 SDK found. GlassyBattery uses glassEffect(), which requires Xcode 26."
            echo "This means macos-latest still points at an image older than macOS 26."
            echo "Pin runs-on to a macos-26 image, or use a self-hosted macOS 26 runner."
            echo "Xcodes present on this image:"
            ls -d /Applications/Xcode*.app
            xcodebuild -showsdks
            exit 1
          fi

      # Sparkle, MultipeerKit and swift-argument-parser are fetched over the network by xcodebuild.
      # Keyed on Package.resolved so the cache invalidates when a dependency version moves.
      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('GlassyBattery.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # TEMPORARY: ENABLE_HARDENED_RUNTIME=NO overrides the project's ENABLE_HARDENED_RUNTIME=YES
      # for ad-hoc CI builds only. Without it the produced app dies in dyld before main() runs:
      #
      #   Library not loaded: @rpath/Sparkle.framework/Versions/B/Sparkle
      #   Reason: ... not valid for use in process: mapping process and mapped file
      #           (non-platform) have different Team IDs
      #
      # Hardened runtime turns on Library Validation, which requires an embedded framework to
      # carry the same Team ID as the host process. Ad-hoc signatures carry NO Team ID at all, on
      # either side, so the match can never succeed and dyld refuses to map Sparkle.framework.
      # Confirmed by isolation: the same bundle re-signed ad-hoc launches fine without `-o
      # runtime` and fails with it, changing nothing else.
      #
      # Dropping hardened runtime costs nothing here because it is only *required* for
      # notarization, which this ad-hoc path does not do. Remove this line the moment the build
      # signs with a real Developer ID — hardened runtime must be ON for anything published.
      - name: Build (ad-hoc signed)
        run: |
          set -euo pipefail
          xcodebuild \
            -project GlassyBattery.xcodeproj \
            -scheme GlassyBattery \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_HARDENED_RUNTIME=NO \
            build

      # The helper and the widget extension are embedded rather than built by the shared scheme
      # directly, so assert they actually made it into the bundle instead of shipping a DMG whose
      # login item or widget is silently missing. And that the app carries the version and the
      # update feed this release is published for.
      - name: Verify bundle
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release/GlassyBattery.app
          codesign --verify --deep --strict "$APP"
          lipo -archs "$APP/Contents/MacOS/GlassyBattery"
          test -d "$APP/Contents/PlugIns/GlassyBatteryWidgetExtension.appex"
          test -d "$APP/Contents/Library/LoginItems/GlassyBatteryHelper.app"
          test -x "$APP/Contents/Resources/logReader.sh"
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$APP/Contents/Info.plist"; }
          test "$(plist CFBundleShortVersionString)" = "${{ steps.version.outputs.version }}"
          test "$(plist CFBundleVersion)" = "${{ steps.version.outputs.build }}"
          echo "Feed: $(plist SUFeedURL)"
          echo "Key:  $(plist SUPublicEDKey)"

      # `codesign --verify` above passes on a bundle that cannot actually launch: it checks that
      # signatures are well-formed, while Library Validation is a load-time policy dyld applies
      # only when the process starts. A hardened-runtime + ad-hoc DMG shipped green through this
      # workflow once already for exactly that reason. So: start the app and confirm dyld got
      # through its embedded frameworks.
      #
      # This fails hard ONLY on a dynamic-linking failure. A menu bar app on a headless runner can
      # exit early for unrelated reasons (no WindowServer session, permissions), which warns
      # instead of failing so this does not become a flaky gate.
      - name: Smoke test launch
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release/GlassyBattery.app
          LOG=$(mktemp)

          "$APP/Contents/MacOS/GlassyBattery" >"$LOG" 2>&1 &
          PID=$!
          sleep 10

          if kill -0 "$PID" 2>/dev/null; then
            kill "$PID" 2>/dev/null || true
            echo "App stayed up for 10s — embedded frameworks loaded."
            exit 0
          fi

          wait "$PID" || true
          if grep -q "Library not loaded\|different Team IDs\|code signature.*not valid" "$LOG"; then
            echo "::error::App died at launch: dyld refused an embedded framework."
            echo "::error::Usually hardened runtime + ad-hoc signing (Library Validation needs matching Team IDs)."
            cat "$LOG"
            exit 1
          fi

          echo "::warning::App exited early, but not from a dynamic-linking failure. Output below."
          cat "$LOG"

      - name: Package DMG
        id: dmg
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release/GlassyBattery.app
          NAME="GlassyBattery-${{ steps.version.outputs.version }}.dmg"

          rm -rf dmg-stage
          mkdir dmg-stage
          ditto "$APP" "dmg-stage/GlassyBattery.app"
          ln -s /Applications dmg-stage/Applications

          hdiutil create \
            -volname "GlassyBattery" \
            -srcfolder dmg-stage \
            -ov -format UDZO \
            "$NAME"

          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassyBattery-${{ steps.version.outputs.version }}-dmg
          path: ${{ steps.dmg.outputs.name }}
          if-no-files-found: error

      # The update's EdDSA signature, checked against the public key the app carries, so a key
      # that doesn't match SUPublicEDKey fails here instead of in every installed copy.
      - name: Sign the update
        if: env.RELEASE == 'true'
        id: sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          FILE: ${{ steps.dmg.outputs.name }}
        run: |
          set -euo pipefail
          BIN=build/SourcePackages/artifacts/sparkle/Sparkle/bin
          SIGNATURE=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$BIN/sign_update" --ed-key-file - -p "$FILE")
          PUBLIC=$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" build/Build/Products/Release/GlassyBattery.app/Contents/Info.plist)
          # The public half of the secret must be the key in the app, or no installed copy accepts it.
          python3 - "$SPARKLE_PRIVATE_KEY" "$PUBLIC" <<'PY'
          import base64, sys
          from hashlib import sha512
          # An ed25519 seed (32 bytes) → its public key, without a crypto library: RFC 8032 §5.1.5.
          seed = base64.b64decode(sys.argv[1].strip())[:32]
          p = 2**255 - 19; q = 2**252 + 27742317777372353535851937790883648493
          d = -121665 * pow(121666, p - 2, p) % p
          def add(P, Q):
              x1, y1, z1, t1 = P; x2, y2, z2, t2 = Q
              a = (y1 - x1) * (y2 - x2) % p; b = (y1 + x1) * (y2 + x2) % p
              c = 2 * t1 * t2 * d % p; dd = 2 * z1 * z2 % p
              e, f, g, h = b - a, dd - c, dd + c, b + a
              return (e * f % p, g * h % p, f * g % p, e * h % p)
          def mul(s, P):
              Q = (0, 1, 1, 0)
              while s:
                  if s & 1: Q = add(Q, P)
                  P = add(P, P); s >>= 1
              return Q
          gy = 4 * pow(5, p - 2, p) % p
          gx = pow((gy * gy - 1) * pow(d * gy * gy + 1, p - 2, p), (p + 3) // 8, p)
          if (gx * gx - (gy * gy - 1) * pow(d * gy * gy + 1, p - 2, p)) % p: gx = gx * pow(2, (p - 1) // 4, p) % p
          if gx & 1: gx = p - gx
          h = sha512(seed).digest()
          a = int.from_bytes(h[:32], "little"); a &= (1 << 254) - 8; a |= 1 << 254
          x, y, z, _ = mul(a, (gx, gy, 1, gx * gy % p))
          zi = pow(z, p - 2, p); x, y = x * zi % p, y * zi % p
          public = base64.b64encode((y | ((x & 1) << 255)).to_bytes(32, "little")).decode()
          if public != sys.argv[2]:
              print(f"::error::SPARKLE_PRIVATE_KEY's public key is {public}, but the app's SUPublicEDKey is {sys.argv[2]}.")
              sys.exit(1)
          print("The secret matches the app's SUPublicEDKey.")
          PY
          echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"

      - name: Release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.dmg.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGNATURE: ${{ steps.sign.outputs.signature }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          BASE="https://github.com/$GITHUB_REPOSITORY/releases"

          # What changed: the PRs merged since the last release, as GitHub lists them.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -q .body > changes.md

          # The update window shows these; Sparkle renders HTML.
          gh api markdown -f text="$(cat changes.md)" -f mode=gfm -f context="$GITHUB_REPOSITORY" > changes.html
          scripts/appcast.sh build/Build/Products/Release/GlassyBattery.app "$FILE" \
            "$BASE/download/$TAG/$FILE" "$SIGNATURE" changes.html "$BASE/tag/$TAG" > appcast.xml
          xmllint --noout appcast.xml

          # Without the first-launch note the release is a trap: an ad-hoc signature makes macOS
          # report a downloaded app as "damaged", with no hint that one command fixes it.
          {
            cat <<NOTES
          Download \`$FILE\` below, open it and drag **GlassyBattery** to Applications. Installed copies update themselves.

          <details><summary>⚠️ First launch of a downloaded copy needs one extra step</summary>

          This build is **ad-hoc signed, not notarized**: it's built by GitHub Actions, which has no
          Developer ID certificate. macOS refuses to open a downloaded copy with *"GlassyBattery is
          damaged and can't be opened"* until you clear the download quarantine flag, once, after
          copying the app to Applications:

          \`\`\`sh
          xattr -dr com.apple.quarantine /Applications/GlassyBattery.app
          \`\`\`

          The app itself is unmodified; \`codesign --verify --deep --strict\` passes on the bundle.
          Updates through *Check for Updates…* don't need this.

          </details>

          Universal binary: Apple Silicon and Intel.

          NOTES
            cat changes.md
          } > release-notes.md

          gh release create "$TAG" "$FILE" appcast.xml \
            --target "$GITHUB_SHA" \
            --title "GlassyBattery $VERSION" \
            --notes-file release-notes.md \
            --latest

# =============================================================================================
# SHIPPING A SIGNED, NOTARIZED DMG — for maintainers who have a valid Developer ID
# =============================================================================================
#
# The ad-hoc path above produces a DMG that only opens after the user clears quarantine by hand.
# If you hold a Developer ID Application certificate, do the following instead. Signing with a
# real team also removes the reason ENABLE_HARDENED_RUNTIME=NO exists, so that line comes out.
#
# ---- 1. Add repository secrets (Settings > Secrets and variables > Actions) ------------------
#
#   MACOS_CERTIFICATE       base64 of your "Developer ID Application" .p12
#                           export from Keychain Access, then: base64 -i cert.p12 | pbcopy
#   MACOS_CERTIFICATE_PWD   the password you set when exporting that .p12
#   KEYCHAIN_PASSWORD       any throwaway string; it only unlocks the temporary CI keychain
#   NOTARY_APPLE_ID         Apple ID belonging to the same team as the certificate
#   NOTARY_TEAM_ID          your 10-character Team ID (the original project's was 7WVM5UGWPF —
#                           use YOUR OWN; it must match the certificate, or notarization fails)
#   NOTARY_PASSWORD         an app-specific password from appleid.apple.com, NOT the account
#                           password. Alternatively store an App Store Connect API key and use
#                           notarytool's --key/--key-id/--issuer instead of these three.
#
# ---- 2. Import the certificate before the build step ----------------------------------------
#
#   - name: Import Developer ID certificate
#     env:
#       MACOS_CERTIFICATE:     ${{ secrets.MACOS_CERTIFICATE }}
#       MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
#       KEYCHAIN_PASSWORD:     ${{ secrets.KEYCHAIN_PASSWORD }}
#     run: |
#       set -euo pipefail
#       echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12
#       security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
#       security default-keychain -s build.keychain
#       security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
#       security set-keychain-settings -lut 21600 build.keychain   # don't relock mid-build
#       security import /tmp/cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" \
#         -T /usr/bin/codesign -T /usr/bin/security
#       # Required, or codesign blocks on a UI password prompt that no one can answer:
#       security set-key-partition-list -S apple-tool:,apple:,codesign: \
#         -s -k "$KEYCHAIN_PASSWORD" build.keychain
#       rm -f /tmp/cert.p12
#       security find-identity -v -p codesigning build.keychain
#
# ---- 3. Replace the ad-hoc build settings ----------------------------------------------------
#
#   Drop these five lines:      CODE_SIGN_IDENTITY="-"
#                               CODE_SIGNING_REQUIRED=NO
#                               DEVELOPMENT_TEAM=""
#                               PROVISIONING_PROFILE_SPECIFIER=""
#                               ENABLE_HARDENED_RUNTIME=NO
#
#   Use instead:                CODE_SIGN_IDENTITY="Developer ID Application"
#                               CODE_SIGNING_REQUIRED=YES
#                               CODE_SIGNING_ALLOWED=YES
#                               CODE_SIGN_STYLE=Manual
#                               DEVELOPMENT_TEAM="<your Team ID>"
#
#   Do NOT re-add ENABLE_HARDENED_RUNTIME=NO. Notarization REJECTS submissions without hardened
#   runtime, and once app and Sparkle.framework share one real Team ID, Library Validation is
#   satisfied and the crash this flag works around cannot occur.
#
#   Xcode signs embedded content (Sparkle.framework, GlassyBatteryWidgetExtension.appex,
#   GlassyBatteryHelper.app) inside-out as part of the build. If you ever re-sign by hand, sign in
#   that same order — frameworks, then appex and login item, then the outer .app — because
#   signing the outer bundle seals the hashes of everything nested inside it.
#
# ---- 4. Notarize and staple, after the "Package DMG" step ------------------------------------
#
#   - name: Notarize and staple
#     env:
#       NOTARY_APPLE_ID:  ${{ secrets.NOTARY_APPLE_ID }}
#       NOTARY_TEAM_ID:   ${{ secrets.NOTARY_TEAM_ID }}
#       NOTARY_PASSWORD:  ${{ secrets.NOTARY_PASSWORD }}
#       FILE:             ${{ steps.dmg.outputs.name }}
#     run: |
#       set -euo pipefail
#       xcrun notarytool submit "$FILE" \
#         --apple-id "$NOTARY_APPLE_ID" \
#         --team-id "$NOTARY_TEAM_ID" \
#         --password "$NOTARY_PASSWORD" \
#         --wait
#       xcrun stapler staple "$FILE"          # staples the ticket so first launch works offline
#       spctl -a -t open --context context:primary-signature -vvv "$FILE"
#
#   On rejection, get the reasons — the summary alone rarely says enough:
#       xcrun notarytool log <submission-id> --apple-id ... --team-id ... --password ...
#
# ---- 5. Sparkle's update feed is a SEPARATE key ----------------------------------------------
#
#   Code signing does not sign updates. Sparkle verifies each update with the EdDSA key from
#   Sparkle's `generate_keys` (SPARKLE_PRIVATE_KEY; see SPARKLE at the top), which the "Sign the
#   update" step already applies to the DMG. Notarizing changes the DMG, so sign after it: move
#   "Sign the update" below "Notarize and staple". Losing that key means installed copies can
#   never update themselves again; keep the export in a password manager.
#
# ---- 6. Verifying the result -----------------------------------------------------------------
#
#   The "Smoke test launch" step catches launch-time linking failures, but check the Gatekeeper
#   story too, on a machine that did NOT build the app:
#       spctl -a -t exec -vvv /Applications/GlassyBattery.app     # expect: accepted, Notarized...
#       codesign -dvvv /Applications/GlassyBattery.app 2>&1 | grep TeamIdentifier   # expect your ID
#   Confirm the same TeamIdentifier on Contents/Frameworks/Sparkle.framework. Two different
#   values there is the exact condition that produced the ad-hoc launch crash.
# =============================================================================================
